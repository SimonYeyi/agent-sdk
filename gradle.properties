# Gradle JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# a2ui 1.0.0-alpha01 的 AAR 元数据声明 compileSdk 37，本项目为 compileSdk 36，
# 不关掉这项检查会直接失败（alpha 依赖实际能在 API 36 上编译运行）
android.experimental.disableCompileSdkChecks=true

# AGP 9 默认启用内置 Kotlin 支持，会与 org.jetbrains.kotlin.android 插件的 kotlin 扩展冲突
android.builtInKotlin=false
# AGP 9 默认使用新 DSL（ApplicationExtensionImpl 不再继承 BaseExtension），
# kotlin-android 插件仍按旧 DSL 强转，必须回退
android.newDsl=false
