# Gradle JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official

# AndroidX (required by AGP 8.9.1+)
android.useAndroidX=true
android.nonTransitiveRClass=true

# a2ui 1.0.0-alpha01 制品 AAR 元数据声明 compileSdk 37 / AGP 9.1.0 要求，
# 本项目工具链为 compileSdk 36 / AGP 8.9.1：跳过 AAR 元数据硬性版本校验
# （alpha 依赖实际 API 在 36 上可编译运行，仅元数据声明超前）。
# compileSdk 检查有官方开关；AGP 版本检查无开关，由消费模块各自跳过 check*AarMetadata 任务。
android.experimental.disableCompileSdkChecks=true

# 沙箱环境阻断 Kotlin daemon 临时文件写入（AccessDeniedException），
# 编译器改 in-process 运行，绕过 daemon 连接失败。
kotlin.compiler.execution.strategy=in-process
