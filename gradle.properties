# Gradle JVM args
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin
kotlin.code.style=official

# AndroidX (required by AGP 8.9.1+)
android.useAndroidX=true
android.nonTransitiveRClass=true

# a2ui 1.0.0-alpha01 AARs declare compileSdk 37 / AGP 9.1.0 in their metadata,
# while this project toolchain is compileSdk 36 / AGP 8.9.1, so skip the hard
# version check (alpha deps actually compile and run on API 36; only the
# metadata is ahead). The compileSdk check has an official switch; the AGP
# version check has none, so consumer modules skip their own check*AarMetadata.
android.experimental.disableCompileSdkChecks=true

# Sandbox blocks Kotlin daemon temp file writes (AccessDeniedException); run the
# compiler in-process to bypass daemon connection failures.
kotlin.compiler.execution.strategy=in-process
